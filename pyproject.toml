[project]
name = "biggame"
version = "0.1.0"
description = "Stanford vs. Cal Big Game on TikTok: collection, multi-model LLM sentiment, dashboard"
requires-python = ">=3.12"
dependencies = [
    "ttresearch",
    "anthropic>=0.70",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.uv.sources]
ttresearch = { path = "../tiktok_data", editable = true }

[project.scripts]
biggame = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "backend"]
